<mat-card>
  <mat-card-header>
    <mat-card-title>Upload PDF Document</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div
      class="drop-zone"
      [class.drag-over]="isDragOver"
      [class.has-file]="uploadedFile"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
      (click)="fileInput.click()"
      role="button"
      tabindex="0"
      aria-label="Upload PDF file">

      @if (isUploading) {
        <mat-spinner diameter="40"></mat-spinner>
        <p class="status-text">Uploading...</p>
      } @else if (uploadedFile) {
        <mat-icon class="success-icon">check_circle</mat-icon>
        <p class="file-name">{{ uploadedFile.fileName }}</p>
        <p class="hint">Click or drop to replace</p>
      } @else {
        <mat-icon class="upload-icon">upload_file</mat-icon>
        <p class="status-text">Drag &amp; drop a PDF here</p>
        <p class="hint">or click to browse</p>
      }
    </div>

    <input
      #fileInput
      type="file"
      accept=".pdf,application/pdf"
      style="display:none"
      (change)="onFileSelected($event)">

    @if (errorMessage) {
      <div class="error-message">
        <mat-icon>error_outline</mat-icon>
        <span>{{ errorMessage }}</span>
      </div>
    }
  </mat-card-content>
</mat-card>
